# Laboratório isolado para o projeto de brute force com Medusa.
# Sobe alvos descartáveis (FTP, SMB, Web/auth básica e DVWA) numa rede Docker
# dedicada, SEM publicar portas no host. Uso exclusivo em ambiente autorizado.
#
#   docker compose -p medusa-lab up -d
#   docker compose -p medusa-lab --profile attacker up -d   # inclui atacante
#   docker compose -p medusa-lab down -v
#
# Credencial "fraca" propositalmente plantada em todos os alvos: msfadmin / msfadmin

name: medusa-lab

networks:
  medusa-lab:
    driver: bridge

services:
  ftp:
    image: delfer/alpine-ftp-server
    container_name: lab-ftp
    networks: [medusa-lab]
    environment:
      USERS: "msfadmin|msfadmin|/home/msfadmin"

  smb:
    image: dperson/samba
    container_name: lab-smb
    networks: [medusa-lab]
    # NT1 + ntlm auth habilitados para compatibilidade com o módulo smbnt (SMBv1);
    # map to guest = Never garante que apenas a credencial correta autentique.
    command:
      - "-g"
      - "server min protocol = NT1"
      - "-g"
      - "client min protocol = NT1"
      - "-g"
      - "ntlm auth = yes"
      - "-g"
      - "map to guest = Never"
      - "-g"
      - "restrict anonymous = 2"
      - "-u"
      - "msfadmin;msfadmin"
      - "-s"
      - "data;/tmp;yes;no;no;msfadmin"

  web:
    image: nginx:alpine
    container_name: lab-web
    networks: [medusa-lab]
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/.htpasswd:/etc/nginx/.htpasswd:ro

  dvwa:
    image: vulnerables/web-dvwa
    container_name: lab-dvwa
    networks: [medusa-lab]

  # Atacante opcional (para hosts sem Medusa nativa, ex.: Windows/macOS).
  # Em um Kali Linux você normalmente ataca direto do host. Ative com:
  #   docker compose -p medusa-lab --profile attacker up -d
  attacker:
    image: ubuntu:22.04
    container_name: lab-attacker
    networks: [medusa-lab]
    command: sleep infinity
    profiles: ["attacker"]
